version: 2

models:
  - name: dim_location_v1
    description: Legacy (old-address) district+city join. Source tables are frozen.
    columns:
      - name: districtId
        data_tests:
          - unique
          - not_null

  - name: dim_location_v2
    description: Active (post-address-reform) ward+city join.
    columns:
      - name: wardId
        data_tests:
          - unique
          - not_null

  - name: dim_project
    description: Full outer join of legacy and active project reference tables.
    columns:
      - name: projectId
        data_tests:
          - unique
          - not_null
