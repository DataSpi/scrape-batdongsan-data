version: 2

seeds:
  - name: dim_real_estate_type_mapping
    description: >
      Lookup for normalizing the real_estate_type slug matched out of a listing's link
      into a canonical Vietnamese label. Ported from the `whitelist` + `type_mapping`
      dict in the removed legacy Python job j_real_estate.py. Two whitelist entries (`ban-nha-rieng`,
      `ban-can-ho-chung-cu`) were intentionally dropped: in the legacy Python loop they
      were always shadowed by an earlier, broader substring match (`nha-rieng` /
      `can-ho-chung-cu` respectively) and could never actually be returned, so keeping
      them would just be dead rows.
    columns:
      - name: raw_token
        data_tests:
          - unique
          - not_null
      - name: real_estate_type
        data_tests:
          - not_null

  - name: dim_district_geo_v1
    description: >
      Lat/lng for each legacy (v1) district, geocoded once via
      src/geocode/geocode_locations.py (Google Geocoding API). Not refreshed on a
      schedule -- districts are static; re-run the script and `dbt seed` manually if
      new districts ever show up. lat/lng are blank (NULL after seed) when the API
      couldn't resolve an address.
    columns:
      - name: districtId
        data_tests:
          - unique
          - not_null

  - name: dim_ward_geo_v2
    description: >
      Lat/lng for each active (v2) ward, geocoded once via
      src/geocode/geocode_locations.py. Same caveats as dim_district_geo_v1.
    columns:
      - name: wardId
        data_tests:
          - unique
          - not_null

  - name: dim_report_period
    description: >
      Report windows ("kỳ báo cáo") for the period site: each row is a named date range
      of date_scraped. fct_real_estate(_rent)_period buckets bronze rows into these
      windows. Add a row (and `dbt seed -s dim_report_period` + `dbt run -s
      dim_report_period+`) when a new monthly report is cut; windows must not overlap
      (tests/assert_report_periods_do_not_overlap.sql).
    config:
      column_types:
        period: string
        label: string
        start_date: date
        end_date: date
    columns:
      - name: period
        description: Period key, 'YYYY-MM' of the report month.
        data_tests:
          - unique
          - not_null
      - name: start_date
        data_tests:
          - not_null
      - name: end_date
        data_tests:
          - not_null
