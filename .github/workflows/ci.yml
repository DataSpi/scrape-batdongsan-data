# GitHub-hosted runners cannot reach batdongsan.com.vn (blocked by the source site --
# see CLAUDE.md/docs/technical-guides.md), so CI never runs the real scrape or the
# Airflow DAGs -- that stays exclusively on the self-hosted local Airflow instance
# (docker-compose.yml, dags/). CI's job is fast feedback only: lint and a Docker
# build (+ publish to GHCR on merge to main). See dbt-ci.yml for the dbt-specific
# job, split out so it only runs when dbt/** actually changes.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt
      # Lint tools only; no need to install the full runtime stack (dbt, patchright, ...).
      - run: pip install -r requirements-dev.txt
      - name: Python lint
        run: ruff check .
      - name: Python format
        run: ruff format --check .
      - name: Python syntax (no imports; scraper modules have import-time side effects)
        run: python -m compileall -q src dags
      - name: SQL lint (dbt models/tests)
        run: sqlfluff lint dbt/models dbt/tests
      - name: Shell scripts
        run: |
          bash -n scripts/run_weekly_pipeline.sh
          shellcheck scripts/*.sh
      - name: launchd plist is well-formed
        run: python -c "import plistlib,sys; [plistlib.load(open(p,'rb')) for p in sys.argv[1:]]" scripts/*.plist
      - name: docker compose config
        run: |
          cp .env.example .env
          docker compose config -q

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: raven-actions/actionlint@v2

  docker-build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires a lowercase repository name; github.repository keeps the owner's casing.
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Builds on every push/PR to validate the Dockerfile; only pushes to GHCR
      # when merged to main (PRs just prove the image builds, nothing is published).
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
